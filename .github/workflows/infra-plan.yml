# Plan only via Pull Request (feature/* → develop, develop → main).
name: infra-plan

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "fast/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub Environment (secrets)
        required: true
        type: choice
        options: [dev, prod]
      tf_env:
        description: Terraform dataset (GCP)
        required: true
        type: choice
        options: [dev, qa, test, prod]

concurrency:
  group: infra-plan-pr-${{ github.event.pull_request.number || 'manual' }}-${{ github.event.inputs.tf_env || 'dev' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Terraform static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.2
          terraform_wrapper: false
      - run: |
          chmod +x scripts/test-static.sh
          ./scripts/test-static.sh dev

  terraform-plan:
    name: Terraform plan (GCP)
    runs-on: ubuntu-latest
    needs: static
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.event.inputs.github_environment || (github.base_ref == 'main' && 'prod' || 'dev') }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_ENV: ${{ github.event.inputs.tf_env || 'dev' }}
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.2
          terraform_wrapper: false
      - name: Init remote state + plan all stacks
        run: |
          chmod +x scripts/ci-gcp-plan.sh scripts/tf-plan-all.sh scripts/tf.sh scripts/infra-preflight.sh
          ./scripts/ci-gcp-plan.sh "${TF_ENV}"
      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans-${{ env.TF_ENV }}-${{ github.run_id }}
          path: ${{ runner.temp }}/tf-plans-${{ env.TF_ENV }}/
          if-no-files-found: ignore
          retention-days: 14
