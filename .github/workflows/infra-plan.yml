# PR -> develop/main: static Terraform checks + remote plan. Manual: workflow_dispatch.
name: Infra Terraform Plan

on:
  pull_request:
    branches: [develop, main]
    paths:
      - "fast/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/infra-plan.yml"
      - ".github/workflows/infra-apply.yml"
  workflow_dispatch:
    inputs:
      github_environment:
        description: GitHub Environment (secrets)
        required: true
        type: choice
        default: dev
        options: [dev, prod]
      tf_env:
        description: Terraform dataset (GCP)
        required: true
        type: choice
        default: dev
        options: [dev, qa, test, prod]

concurrency:
  group: infra-plan-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TF_VERSION: "1.10.2"
  TF_ENV: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tf_env || (github.base_ref == 'main' && 'prod' || 'dev') }}

jobs:
  static:
    name: Terraform static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive fast/modules fast/stages

      - name: terraform validate
        run: |
          set -euo pipefail
          stack_dir() {
            case "$1" in
              project_services|cloud_storage|github_wif) echo "fast/stages/0-bootstrap/$1" ;;
              network) echo "fast/stages/1-network/network" ;;
              gke|cloudsql|pubsub|cloudrun) echo "fast/stages/2-platform/$1" ;;
            esac
          }
          for stack in project_services cloud_storage github_wif network gke cloudsql pubsub cloudrun; do
            dir="$(stack_dir "${stack}")"
            echo "::group::terraform validate — ${stack}"
            pushd "${dir}" >/dev/null
            terraform init -backend=false -input=false >/dev/null
            terraform validate
            popd >/dev/null
            echo "::endgroup::"
          done

      - name: terraform test (unit)
        run: |
          cd tests/unit
          terraform init -backend=false -input=false >/dev/null
          terraform test

      - name: terraform test (integration)
        run: |
          cd tests/integration/platform
          terraform init -backend=false -input=false >/dev/null
          terraform test

  terraform-plan:
    name: Terraform plan (GCP)
    runs-on: ubuntu-latest
    needs: static
    timeout-minutes: 60
    environment: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.github_environment || (github.base_ref == 'main' && 'prod' || 'dev') }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}
      TF_PLAN_DIR: ${{ runner.temp }}/tf-plans-${{ env.TF_ENV }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform init and plan (all stacks)
        run: |
          set -euo pipefail
          chmod +x scripts/tf.sh scripts/tf-plan-all.sh
          mkdir -p "${TF_PLAN_DIR}"
          ./scripts/tf-plan-all.sh "${{ env.TF_ENV }}"

      - name: Upload plan artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plans-${{ env.TF_ENV }}-${{ github.run_id }}
          path: ${{ env.TF_PLAN_DIR }}/
          if-no-files-found: ignore
          retention-days: 14
