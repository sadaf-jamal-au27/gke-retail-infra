# Manual apply only (Actions → Infra · Terraform apply). Use GitHub Environment reviewers on dev/prod.
name: Infra · Terraform apply

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to deploy (must match merged PR target)
        required: true
        type: choice
        default: develop
        options: [develop, main]
      github_environment:
        description: GitHub Environment (secrets)
        required: true
        type: choice
        default: dev
        options: [dev, prod]
      tf_env:
        description: Terraform dataset (GCP)
        required: true
        type: choice
        default: dev
        options: [dev, qa, test, prod]

concurrency:
  group: infra-apply-${{ github.event.inputs.branch }}-${{ github.event.inputs.tf_env }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VERSION: "1.10.2"
  FAST_ROOT: fast

jobs:
  terraform-apply:
    name: Terraform apply (GCP)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ github.event.inputs.github_environment }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_ENV: ${{ github.event.inputs.tf_env }}
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}
      TF_PLAN_DIR: ${{ runner.temp }}/tf-plans-${{ github.event.inputs.tf_env }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - name: terraform plan (saved plans)
        uses: ./.github/actions/terraform-fast
        with:
          fast_root: ${{ env.FAST_ROOT }}
          tf_env: ${{ env.TF_ENV }}
          command: plan
          plan_directory: ${{ env.TF_PLAN_DIR }}
      - name: terraform apply (saved plans)
        uses: ./.github/actions/terraform-fast
        with:
          fast_root: ${{ env.FAST_ROOT }}
          tf_env: ${{ env.TF_ENV }}
          command: apply
          plan_directory: ${{ env.TF_PLAN_DIR }}
