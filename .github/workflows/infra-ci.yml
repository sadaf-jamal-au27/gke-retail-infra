name: infra-ci

on:
  push:
    branches: [main]
    paths:
      - "fast/**"
      - "scripts/**"
      - ".github/workflows/infra-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "fast/**"
      - "scripts/**"
      - ".github/workflows/infra-ci.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [dev, qa, test, prod]
      action:
        description: Terraform action (live GCP)
        required: true
        type: choice
        options: [plan, apply]

concurrency:
  group: infra-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  unit:
    name: terraform unit (fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.2
      - name: Unit tests
        run: |
          chmod +x scripts/test-unit.sh
          ./scripts/test-unit.sh dev

  integration:
    name: terraform integration (fast)
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.2
      - name: Integration tests
        run: |
          chmod +x scripts/test-integration.sh
          ./scripts/test-integration.sh dev

  terraform-live:
    name: GCP plan/apply
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    environment: ${{ github.event.inputs.environment || 'dev' }}
    env:
      TF_ENV: ${{ github.event.inputs.environment || 'dev' }}
      TF_ACTION: ${{ github.event.inputs.action || 'plan' }}
      TF_VAR_database_password: ${{ secrets.TF_VAR_DATABASE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_CI_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.2

      - name: Terraform FAST stacks
        run: |
          chmod +x scripts/tf-apply-all.sh scripts/tf.sh
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            ./scripts/tf-apply-all.sh "${TF_ENV}" plan
          else
            ./scripts/tf-apply-all.sh "${TF_ENV}" "${TF_ACTION}"
          fi
